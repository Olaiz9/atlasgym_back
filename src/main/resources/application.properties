# Configuración del puerto del servidor (por defecto es 8080)
server.port=${SERVER_PORT:8080}
# Respetar cabeceras X-Forwarded-For / X-Forwarded-Proto detrás de Nginx / Reverse Proxy
server.forward-headers-strategy=framework

# Conexión a MySQL: SPRING_DATASOURCE_URL completa (docker-compose) o DB_HOST/DB_PORT (por defecto localhost:3307)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/atlas_gym?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de Hibernate (en desarrollo update; en perfil prod se fuerza validate con Flyway)
spring.jpa.hibernate.ddl-auto=${ATLAS_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${ATLAS_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Migraciones Flyway (activar en producción mediante SPRING_PROFILES_ACTIVE=prod o ATLAS_FLYWAY_ENABLED=true)
spring.flyway.enabled=${ATLAS_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# Ocultar stacktraces y detalles internos en el endpoint /error por seguridad
server.error.include-stacktrace=never
server.error.include-message=never

# Seguridad y JWT
# Configuracion local opcional, excluida de Git. En despliegue usar variable de entorno.
spring.config.import=optional:file:./config/atlas-local.properties
# Sin clave predeterminada: JwtService rechaza el arranque si falta o es demasiado corta.
atlas.jwt.secret=${ATLAS_JWT_SECRET:}
# Expiración: 24 horas en milisegundos (24 * 60 * 60 * 1000)
atlas.jwt.expiration=${ATLAS_JWT_EXPIRATION:86400000}

# Secreto opcional para autenticar la tablet del Tótem (X-Totem-Secret)
atlas.totem.secret=${ATLAS_TOTEM_SECRET:}

# CORS (Frontend Next.js)
atlas.cors.allowed-origin=${ATLAS_CORS_ALLOWED_ORIGIN:${FRONTEND_URL:http://localhost:3000}}

# Semilla de datos de demostración (activar en desarrollo, desactivar en producción con ATLAS_SEED_ENABLED=false)
atlas.seed.enabled=${ATLAS_SEED_ENABLED:true}

# Alta inicial de un administrador: opt-in, sin credenciales predeterminadas.
atlas.admin.bootstrap.enabled=${ATLAS_ADMIN_BOOTSTRAP_ENABLED:false}
atlas.admin.bootstrap.email=${ATLAS_ADMIN_EMAIL:}
atlas.admin.bootstrap.password=${ATLAS_ADMIN_PASSWORD:}
atlas.admin.bootstrap.nombre=${ATLAS_ADMIN_NOMBRE:}
# Segundo titular (hermano co-dueño), opcional
atlas.admin2.bootstrap.email=${ATLAS_ADMIN2_EMAIL:}
atlas.admin2.bootstrap.password=${ATLAS_ADMIN2_PASSWORD:}
atlas.admin2.bootstrap.nombre=${ATLAS_ADMIN2_NOMBRE:}
# Versión y metadatos de compilación
atlas.version.commit=${ATLAS_BACK_COMMIT:}
