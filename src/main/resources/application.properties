# Configuración del puerto del servidor (por defecto es 8080)
server.port=${SERVER_PORT:8080}
# Respetar cabeceras X-Forwarded-For / X-Forwarded-Proto detrás de Nginx / Reverse Proxy
server.forward-headers-strategy=framework

# Conexión a la base de datos MySQL (por defecto puerto 3307, configurable por variable DB_PORT)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:${DB_PORT:3307}/atlas_gym?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de Hibernate (en desarrollo update; en perfil prod se fuerza validate con Flyway)
spring.jpa.hibernate.ddl-auto=${ATLAS_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${ATLAS_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Migraciones Flyway (activar en producción mediante SPRING_PROFILES_ACTIVE=prod o ATLAS_FLYWAY_ENABLED=true)
spring.flyway.enabled=${ATLAS_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# Ocultar stacktraces y detalles internos en el endpoint /error por seguridad
server.error.include-stacktrace=never
server.error.include-message=never

# Seguridad y JWT (parametrizado por variable de entorno ATLAS_JWT_SECRET)
# Clave secreta HMAC-SHA256 (mínimo 256 bits)
atlas.jwt.secret=${ATLAS_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Expiración: 24 horas en milisegundos (24 * 60 * 60 * 1000)
atlas.jwt.expiration=${ATLAS_JWT_EXPIRATION:86400000}

# Secreto opcional para autenticar la tablet del Tótem (X-Totem-Secret)
atlas.totem.secret=${ATLAS_TOTEM_SECRET:}

# CORS (Frontend Next.js)
atlas.cors.allowed-origin=${ATLAS_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Credenciales de los Administradores iniciales (los 2 hermanos dueños del gimnasio)
atlas.admin.email=${ATLAS_ADMIN_EMAIL:admin@atlasgym.com}
atlas.admin.password=${ATLAS_ADMIN_PASSWORD:admin123}
atlas.admin.nombre=${ATLAS_ADMIN_NOMBRE:}
atlas.admin2.email=${ATLAS_ADMIN2_EMAIL:}
atlas.admin2.password=${ATLAS_ADMIN2_PASSWORD:}
atlas.admin2.nombre=${ATLAS_ADMIN2_NOMBRE:}

# Semilla de datos de demostración (activar en desarrollo, desactivar en producción con ATLAS_SEED_ENABLED=false)
atlas.seed.enabled=${ATLAS_SEED_ENABLED:true}
