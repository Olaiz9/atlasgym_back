# Configuración del puerto del servidor (por defecto es 8080)
server.port=8080

# Conexión a la base de datos MySQL (por defecto localhost y puerto 3307, configurable por variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/atlas_gym?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de Hibernate (Crea o actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad y JWT
# Configuracion local opcional, excluida de Git. En despliegue usar variable de entorno.
spring.config.import=optional:file:./config/atlas-local.properties
# Sin clave predeterminada: JwtService rechaza el arranque si falta o es demasiado corta.
atlas.jwt.secret=${ATLAS_JWT_SECRET:}
# Expiración: 24 horas en milisegundos (24 * 60 * 60 * 1000)
atlas.jwt.expiration=86400000

# CORS (Frontend Next.js)
atlas.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

# Semilla de datos de demostración (activar en desarrollo, desactivar en producción con ATLAS_SEED_ENABLED=false)
atlas.seed.enabled=${ATLAS_SEED_ENABLED:true}

# Alta inicial de un administrador: opt-in, sin credenciales predeterminadas.
atlas.admin.bootstrap.enabled=${ATLAS_ADMIN_BOOTSTRAP_ENABLED:false}
atlas.admin.bootstrap.email=${ATLAS_ADMIN_EMAIL:}
atlas.admin.bootstrap.password=${ATLAS_ADMIN_PASSWORD:}
