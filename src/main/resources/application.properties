# Configuración del puerto del servidor (por defecto es 8080)
server.port=8080

# Conexión a la base de datos MySQL (por defecto localhost y puerto 3307, configurable por variables)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/atlas_gym?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de Hibernate (Crea o actualiza las tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Seguridad y JWT
# Clave secreta HMAC-SHA256 (256 bits)
atlas.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración: 24 horas en milisegundos (24 * 60 * 60 * 1000)
atlas.jwt.expiration=86400000

# CORS (Frontend Next.js)
atlas.cors.allowed-origin=${FRONTEND_URL:http://localhost:3000}

# Semilla de datos de demostración (activar en desarrollo, desactivar en producción con ATLAS_SEED_ENABLED=false)
atlas.seed.enabled=${ATLAS_SEED_ENABLED:true}
