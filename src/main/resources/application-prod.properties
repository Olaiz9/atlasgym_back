# ============================================================================
# ATLAS Gym - Perfil de Producción (SPRING_PROFILES_ACTIVE=prod)
# Sin secretos hardcodeados ni mutaciones automáticas de esquema Hibernate.
# ============================================================================

# Flyway ejecuta migraciones versionadas y Hibernate valida estrictamente el esquema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Semilla de demostración desactivada en producción real
atlas.seed.enabled=${ATLAS_SEED_ENABLED:false}

# Secretos y credenciales obligatorias por variables de entorno (falla en arranque si faltan)
atlas.jwt.secret=${ATLAS_JWT_SECRET}
atlas.admin.email=${ATLAS_ADMIN_EMAIL}
atlas.admin.password=${ATLAS_ADMIN_PASSWORD}
atlas.admin.nombre=${ATLAS_ADMIN_NOMBRE:}
atlas.admin2.email=${ATLAS_ADMIN2_EMAIL:}
atlas.admin2.password=${ATLAS_ADMIN2_PASSWORD:}
atlas.admin2.nombre=${ATLAS_ADMIN2_NOMBRE:}
atlas.cors.allowed-origin=${ATLAS_CORS_ALLOWED_ORIGIN}
atlas.totem.secret=${ATLAS_TOTEM_SECRET:}
