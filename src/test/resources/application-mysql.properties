# ============================================================================
# ATLAS Gym - Perfil de tests contra MySQL 8 real (./mvnw -Pmysql test)
# Usa Testcontainers (jdbc:tc:mysql:8.0:///atlas_test), Flyway activo y
# validación estricta de esquema Hibernate (ddl-auto=validate), igual que prod.
# ============================================================================

spring.datasource.url=${ATLAS_TEST_MYSQL_URL:jdbc:tc:mysql:8.0:///atlas_test}
spring.datasource.driver-class-name=${ATLAS_TEST_MYSQL_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
spring.datasource.username=${ATLAS_TEST_MYSQL_USER:root}
spring.datasource.password=${ATLAS_TEST_MYSQL_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.test.database.replace=none
atlas.test.flyway.url=${ATLAS_TEST_MYSQL_URL:jdbc:tc:mysql:8.0:///atlas_test}
