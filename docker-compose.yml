# ============================================================================
# ATLAS Gym - Orquestación Productiva Completa (MySQL 8 + Backend + Frontend + Caddy + túnel de Cloudflare)
# Uso:
#   1. Copiar .env.example a .env y completar todas las claves reales.
#   2. Ejecutar: docker compose up -d --build
# ============================================================================

# Logs de Docker con rotacion: sin esto crecen sin tope y terminan llenando el disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Los limites de memoria (mem_limit) son techos, no reservas. Valores pensados para un VPS
# de 4 GB (MySQL + Java + Node + margen para el sistema y para compilar). Se ajustan en .env.

services:
  mysql:
    image: mysql:8.0
    container_name: atlas-mysql
    restart: unless-stopped
    logging: *logging
    mem_limit: ${MYSQL_MEM_LIMIT:-1g}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=-03:00
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-atlas_gym}
      MYSQL_USER: ${DB_USER:?Definir DB_USER en .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en .env}
    # Solo accesible desde localhost del servidor para backups; nunca expuesto a Internet público
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - atlas_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas-backend
    restart: unless-stopped
    logging: *logging
    # La JVM usa MaxRAMPercentage=75 (Dockerfile): sin este techo tomaria el 75% de la RAM del
    # servidor y dejaria sin memoria a MySQL y al front. Con 1g queda ~768 MB de heap.
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-atlas_gym}?serverTimezone=America/Argentina/Buenos_Aires&characterEncoding=UTF-8
      DB_USER: ${DB_USER:?Definir DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
      ATLAS_JWT_SECRET: ${ATLAS_JWT_SECRET:?Definir ATLAS_JWT_SECRET (min 64 hex / 32 bytes) en .env}
      ATLAS_JWT_EXPIRATION: ${ATLAS_JWT_EXPIRATION:-86400000}
      ATLAS_ADMIN_BOOTSTRAP_ENABLED: ${ATLAS_ADMIN_BOOTSTRAP_ENABLED:-true}
      ATLAS_ADMIN_EMAIL: ${ATLAS_ADMIN_EMAIL:?Definir ATLAS_ADMIN_EMAIL en .env}
      ATLAS_ADMIN_PASSWORD: ${ATLAS_ADMIN_PASSWORD:?Definir ATLAS_ADMIN_PASSWORD en .env}
      ATLAS_ADMIN_NOMBRE: ${ATLAS_ADMIN_NOMBRE:-}
      ATLAS_ADMIN2_EMAIL: ${ATLAS_ADMIN2_EMAIL:-}
      ATLAS_ADMIN2_PASSWORD: ${ATLAS_ADMIN2_PASSWORD:-}
      ATLAS_ADMIN2_NOMBRE: ${ATLAS_ADMIN2_NOMBRE:-}
      ATLAS_CORS_ALLOWED_ORIGIN: ${ATLAS_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      ATLAS_TOTEM_SECRET: ${ATLAS_TOTEM_SECRET:-}
      ATLAS_TOTEM_HORARIO: ${ATLAS_TOTEM_HORARIO:-06:00-23:00}
      ATLAS_TOTEM_ALERTA_MINUTOS: ${ATLAS_TOTEM_ALERTA_MINUTOS:-5}
      ATLAS_BACK_COMMIT: ${ATLAS_BACK_COMMIT:-}
      ATLAS_SEED_ENABLED: "false"
    # Accesible localmente en el host y por la red interna de Docker (frontend -> http://backend:8080)
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"

  frontend:
    build:
      context: ${ATLAS_FRONT_DIR:-../atlasgym_front}
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/backend-api}
        # PIN de 4 digitos para habilitar la tablet del totem (vacio = 1234 de fabrica)
        NEXT_PUBLIC_TOTEM_PIN: ${ATLAS_TOTEM_PIN:-}
        # Commit que se muestra en el login; lo completa scripts/actualizar.sh
        GIT_COMMIT: ${ATLAS_FRONT_COMMIT:-}
    container_name: atlas-frontend
    restart: unless-stopped
    logging: *logging
    mem_limit: ${FRONTEND_MEM_LIMIT:-768m}
    depends_on:
      - backend
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      NODE_ENV: production
      PORT: 3000
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
    # Solo accesible desde el propio servidor: el publico entra por Caddy (HTTPS).
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    container_name: atlas-caddy
    restart: unless-stopped
    logging: *logging
    mem_limit: ${CADDY_MEM_LIMIT:-256m}
    depends_on:
      - backend
      - frontend
    environment:
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # ":80" con el túnel de Cloudflare (HTTP interno); el dominio en modo directo (HTTPS propio)
      ATLAS_CADDY_SITIO: ${ATLAS_CADDY_SITIO:-${ATLAS_DOMAIN:-localhost}}
    # Docker publica los puertos POR ENCIMA del firewall ufw: cerrarlos en ufw no alcanza.
    # Con el túnel CADDY_BIND=127.0.0.1 (por defecto) y nadie de afuera llega a 80/443 sin pasar por
    # Cloudflare. En modo directo, CADDY_BIND=0.0.0.0.
    ports:
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND:-127.0.0.1}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - atlas_caddy_data:/data
      - atlas_caddy_config:/config

  # Túnel de Cloudflare (producción): abre una conexión SALIENTE hacia Cloudflare y por ahí entran
  # los visitantes, sin abrir puertos en el servidor. Se activa con COMPOSE_PROFILES=tunel en el .env.
  # El dominio público y su destino (http://caddy:80) se configuran en el panel de Cloudflare
  # (docs/DEPLOY.md, paso 2.1).
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: atlas-cloudflared
    profiles: ["tunel"]
    restart: unless-stopped
    logging: *logging
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-128m}
    depends_on:
      - caddy
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

volumes:
  atlas_mysql_data:
  atlas_caddy_data:
  atlas_caddy_config:
