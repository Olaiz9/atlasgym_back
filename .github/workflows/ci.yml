# CI del backend: corre en cada push y en cada Pull Request.
# Si algun paso falla, el commit/PR queda marcado en rojo en GitHub.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Si se sube un commit nuevo a la misma rama, se cancela la corrida anterior (ahorra minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Maven, Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Atrapa restos de conflictos de merge (<<<<<<<, =======, >>>>>>>) en cualquier archivo,
      # incluso en los que ningun test ejecuta (ej.: Dockerfile).
      - name: Sin marcadores de conflicto
        run: |
          if git grep -n -I -E '^(<<<<<<<|=======|>>>>>>>)(\s|$)' -- . ':!*.md'; then
            echo "::error::Quedaron marcadores de conflicto de merge (ver lineas arriba)"
            exit 1
          fi

      # Misma version de Java que la imagen de produccion (eclipse-temurin:17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Los tests usan H2 en memoria (src/test/resources/application.properties):
      # no necesitan MySQL ni secretos.
      - name: Compilar y correr tests
        run: ./mvnw -B clean test

      # Si falla, se pueden descargar los reportes desde la pagina de la corrida.
      - name: Guardar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports/

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Solo verifica que la imagen de produccion se construya; no la publica en ningun lado.
      - name: Construir imagen
        run: docker build -t atlasgym-back:ci .
