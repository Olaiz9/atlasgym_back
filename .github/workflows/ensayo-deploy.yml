# Ensayo general del deploy: levanta el sistema COMPLETO como en el servidor de produccion
# (docker compose: MySQL 8 + backend + frontend + Caddy con HTTPS), lo prueba de punta a punta
# y simula un desastre: backup -> borrar la base -> restaurar -> verificar que no falte nada.
# Al final pasa Caddy al modo tunel de Cloudflare (el de produccion) y lo prueba.
name: Ensayo de deploy

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ensayo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ensayo:
    name: Ensayo de deploy (Compose + backup/restore)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_PASS: ensayo-clave-db
      ROOT_PASS: ensayo-clave-root
    steps:
      - uses: actions/checkout@v5

      # Frontend: misma rama que el back si existe en el repo del front; si no, develop.
      - name: Descargar frontend
        run: |
          RAMA="${{ github.head_ref || github.ref_name }}"
          URL="https://github.com/${{ github.repository_owner }}/atlasgym_front.git"
          if ! git ls-remote --exit-code --heads "$URL" "$RAMA" >/dev/null; then
            echo "La rama $RAMA no existe en el front, se usa develop"; RAMA=develop
          fi
          echo "Frontend: rama $RAMA"
          git clone --depth 1 --branch "$RAMA" "$URL" front-src

      # .env de ensayo: mismas variables que .env.example, con valores descartables.
      # Los titulares coinciden con los que espera scripts/smoke-api.ps1.
      - name: Preparar .env de ensayo
        run: |
          cat > .env <<EOF
          TZ=America/Argentina/Buenos_Aires
          ATLAS_FRONT_DIR=./front-src
          MYSQL_DATABASE=atlas_gym
          DB_USER=atlas_app
          DB_PASSWORD=${DB_PASS}
          MYSQL_ROOT_PASSWORD=${ROOT_PASS}
          DB_HOST_PORT=3307
          ATLAS_JWT_SECRET=$(openssl rand -hex 32)
          ATLAS_JWT_EXPIRATION=86400000
          ATLAS_ADMIN_BOOTSTRAP_ENABLED=true
          ATLAS_ADMIN_EMAIL=titular1@smoke.local
          ATLAS_ADMIN_PASSWORD=SmokeTitular1!
          ATLAS_ADMIN_NOMBRE=Titular 1
          ATLAS_ADMIN2_EMAIL=titular2@smoke.local
          ATLAS_ADMIN2_PASSWORD=SmokeTitular2!
          ATLAS_ADMIN2_NOMBRE=Titular 2
          ATLAS_TOTEM_SECRET=secreto-tablet-smoke
          ATLAS_TOTEM_PIN=4821
          BACKUP_SOLO_LOCAL=1
          ATLAS_CORS_ALLOWED_ORIGIN=https://localhost
          NEXT_PUBLIC_API_URL=/backend-api
          BACKEND_INTERNAL_URL=http://backend:8080
          ATLAS_DOMAIN=localhost
          CADDY_BIND=0.0.0.0
          CADDY_HTTP_PORT=80
          CADDY_HTTPS_PORT=443
          BACKEND_HOST_PORT=8080
          FRONTEND_HOST_PORT=3000
          EOF

      # Mismo script que se usa en el servidor real (docs/DEPLOY.md), sin git pull.
      - name: Construir y levantar todo (scripts/actualizar.sh)
        run: bash scripts/actualizar.sh --sin-git

      # Se entra POR CADDY (https://localhost), como lo harian los titulares.
      - name: Esperar a que el sistema responda por HTTPS
        run: |
          for i in $(seq 1 90); do
            if curl -skf -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' \
                 -d '{"email":"titular1@smoke.local","password":"SmokeTitular1!"}' >/dev/null; then
              echo "Sistema listo"; exit 0
            fi
            sleep 4
          done
          echo "::error::El sistema no respondio por HTTPS a tiempo"
          docker compose ps; docker compose logs --tail 80; exit 1

      - name: Verificar Caddy, rutas y puertos expuestos
        run: |
          set -e
          falla() { echo "::error::$1"; exit 1; }
          codigo() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }

          [ "$(codigo https://localhost/login)" = "200" ] || falla "La pantalla de login no carga por HTTPS"
          curl -sk https://localhost/privacidad | grep -q "Política de privacidad" || falla "La política de privacidad no carga"
          [ "$(codigo https://localhost/backend-api/planes)" = "200" ] || falla "El proxy /backend-api del front no llega al backend"
          [ "$(codigo https://localhost/api/planes)" = "200" ] || falla "Caddy no enruta /api al backend"

          # HTTP redirige a HTTPS
          [ "$(codigo http://localhost/login)" = "308" ] || falla "http:// no redirige a https://"

          # Cabeceras de seguridad de Caddy
          CAB=$(curl -skI https://localhost/login)
          echo "$CAB" | grep -qi '^x-content-type-options: nosniff' || falla "Falta X-Content-Type-Options"
          echo "$CAB" | grep -qi '^x-frame-options' || falla "Falta X-Frame-Options"

          # Desde Internet solo deben verse 80 y 443. Backend, frontend y MySQL: solo desde el propio servidor.
          ss -ltn
          for p in 3000 3307 8080; do
            if ss -ltnH "sport = :$p" | awk '{print $4}' | grep -vqE '^(127\.0\.0\.1|\[::1\]):'; then
              falla "El puerto $p queda expuesto fuera del servidor (debe escuchar solo en 127.0.0.1)"
            fi
          done
          echo "Caddy, rutas, cabeceras y puertos OK"

      - name: Prueba de humo completa (API contra MySQL 8)
        shell: pwsh
        run: ./scripts/smoke-api.ps1 -Base http://127.0.0.1:8080

      - name: Simulacro de desastre (backup, borrar la base, restaurar)
        run: |
          set -e
          contar() {
            docker exec -e MYSQL_PWD="$DB_PASS" atlas-mysql mysql -N -u atlas_app atlas_gym -e \
              "SELECT CONCAT_WS(' ', (SELECT COUNT(*) FROM usuarios), (SELECT COUNT(*) FROM alumnos), (SELECT COUNT(*) FROM planes), (SELECT COUNT(*) FROM pagos), (SELECT COUNT(*) FROM movimientos_caja), (SELECT COUNT(*) FROM asistencias))"
          }

          ./scripts/backup-mysql.sh
          ARCHIVO=$(ls -t backups/atlas_gym_*.sql.gz | head -1)
          ANTES=$(contar)
          echo "Backup: $ARCHIVO ($(wc -c < "$ARCHIVO") bytes)"
          echo "Antes   (usuarios alumnos planes pagos movimientos asistencias): $ANTES"

          # El desastre: la base desaparece entera
          docker exec -e MYSQL_PWD="$ROOT_PASS" atlas-mysql mysql -u root -e \
            "DROP DATABASE atlas_gym; CREATE DATABASE atlas_gym CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          echo "Base borrada: $(docker exec -e MYSQL_PWD="$ROOT_PASS" atlas-mysql mysql -N -u root atlas_gym -e 'SHOW TABLES' | wc -l) tablas"

          bash scripts/restore-mysql.sh "$ARCHIVO" --yes
          DESPUES=$(contar)
          echo "Despues (usuarios alumnos planes pagos movimientos asistencias): $DESPUES"
          [ "$ANTES" = "$DESPUES" ] || { echo "::error::Faltan datos despues de restaurar: antes=$ANTES despues=$DESPUES"; exit 1; }

          # El sistema vuelve a funcionar con los datos restaurados (login por HTTPS)
          for i in $(seq 1 30); do
            if curl -skf -X POST https://localhost/api/auth/login -H 'Content-Type: application/json' \
                 -d '{"email":"titular1@smoke.local","password":"SmokeTitular1!"}' >/dev/null; then
              echo "Restauracion OK: mismos datos y el sistema responde"; exit 0
            fi
            sleep 2
          done
          echo "::error::Despues de restaurar, el login no funciona"; exit 1

      - name: Revisar scripts de backup (shellcheck)
        run: shellcheck scripts/backup-mysql.sh scripts/verificar-backup.sh

      # El backup restaurado en un MySQL temporal tiene que dar los mismos conteos que la base real.
      - name: Verificar backup en un MySQL temporal (verificar-backup.sh)
        run: |
          set -e
          contar() {
            docker exec -e MYSQL_PWD="$DB_PASS" atlas-mysql mysql -N -u atlas_app atlas_gym -e               "SELECT CONCAT_WS(' ', (SELECT COUNT(*) FROM usuarios), (SELECT COUNT(*) FROM alumnos), (SELECT COUNT(*) FROM planes), (SELECT COUNT(*) FROM pagos), (SELECT COUNT(*) FROM movimientos_caja), (SELECT COUNT(*) FROM asistencias))"
          }
          ARCHIVO=$(ls -t backups/atlas_gym_*.sql.gz | head -1)
          REAL=$(contar)
          SALIDA=$(bash scripts/verificar-backup.sh "$ARCHIVO")
          echo "$SALIDA"
          VERIFICADO=$(echo "$SALIDA" | sed -n 's/^CONTEOS //p')
          echo "Base real: $REAL | Backup verificado: $VERIFICADO"
          [ "$REAL" = "$VERIFICADO" ] || { echo "::error::El backup verificado no coincide con la base real"; exit 1; }
          [ -z "$(docker ps -aq --filter name=atlas-verificar-backup)" ] || { echo "::error::verificar-backup.sh dejo contenedores vivos"; exit 1; }

          # Un backup roto tiene que dar error
          head -c 4000 "$ARCHIVO" > /tmp/roto.sql.gz
          if bash scripts/verificar-backup.sh /tmp/roto.sql.gz; then
            echo "::error::verificar-backup.sh acepto un backup roto"; exit 1
          fi
          echo "Backup roto rechazado OK"

      # Si la copia externa no llega, el backup tiene que terminar con error (y el local quedar).
      - name: Backup falla si la copia externa no llega
        run: |
          set -e
          sudo apt-get install -y -qq rclone >/dev/null
          ANTES=$(ls backups/atlas_gym_*.sql.gz | wc -l)
          sleep 1
          if RCLONE_REMOTE="remoto-inexistente:atlas" ./scripts/backup-mysql.sh; then
            echo "::error::backup-mysql.sh termino bien aunque la copia externa no llego"; exit 1
          fi
          DESPUES=$(ls backups/atlas_gym_*.sql.gz | wc -l)
          [ "$DESPUES" -gt "$ANTES" ] || { echo "::error::No quedo el backup local"; exit 1; }
          if BACKUP_OFFSITE_DIR="/no/existe" ./scripts/backup-mysql.sh; then
            echo "::error::backup-mysql.sh termino bien con una carpeta externa inexistente"; exit 1
          fi
          # Sin ninguna copia externa configurada (y sin BACKUP_SOLO_LOCAL) tambien tiene que fallar
          cp .env /tmp/env-ensayo
          sed -i '/^BACKUP_SOLO_LOCAL=/d' .env
          if ./scripts/backup-mysql.sh; then
            cp /tmp/env-ensayo .env
            echo "::error::backup-mysql.sh termino bien sin copia fuera del servidor"; exit 1
          fi
          cp /tmp/env-ensayo .env
          echo "Fallas de copia externa detectadas OK"

      # Produccion usa el tunel de Cloudflare: Caddy por HTTP solo dentro del servidor y la IP real
      # del visitante sale de CF-Connecting-IP. El tunel se simula con un curl dentro de la red de
      # Docker, que es desde donde llega el trafico de cloudflared.
      - name: Modo tunel (Caddy por HTTP, puertos cerrados, IP real desde CF-Connecting-IP)
        run: |
          set -e
          falla() { echo "::error::$1"; exit 1; }
          sed -i '/^CADDY_BIND=/d' .env
          echo 'ATLAS_CADDY_SITIO=:80' >> .env
          echo 'CADDY_BIND=127.0.0.1' >> .env
          docker compose up -d caddy

          RED=$(docker inspect atlas-caddy -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          tunel() { docker run --rm --network "$RED" curlimages/curl:8.11.1 -s "$@"; }
          codigo() { tunel -o /dev/null -w '%{http_code}' "$@"; }

          # "up caddy" tambien vuelve a levantar el back (lo freno la restauracion): esperar a que responda
          for i in $(seq 1 60); do [ "$(codigo http://caddy/api/planes)" = "200" ] && break; sleep 3; done
          [ "$(codigo http://caddy/login)" = "200" ] || falla "Con el tunel, Caddy no sirve la web por HTTP"
          [ "$(codigo http://caddy/backend-api/planes)" = "200" ] || falla "Con el tunel, /backend-api no llega al backend"
          [ "$(codigo http://caddy/api/salud)" = "200" ] || falla "Con el tunel, /api/salud no responde"

          # 80 y 443 solo dentro del servidor: nadie llega sin pasar por Cloudflare
          ss -ltn
          for p in 80 443; do
            if ss -ltnH "sport = :$p" | awk '{print $4}' | grep -vqE '^(127\.0\.0\.1|\[::1\]):'; then
              falla "Con el tunel el puerto $p no debe quedar expuesto fuera del servidor"
            fi
          done

          # IP real: 5 logins fallidos desde una IP bloquean a esa IP y no a las demas.
          # Se prueba por /api (Caddy -> back) y por /backend-api (Caddy -> front -> back).
          login() {
            codigo -X POST "http://caddy/$1/auth/login" -H 'Content-Type: application/json' \
              -H "CF-Connecting-IP: $2" -d '{"email":"titular2@smoke.local","password":"incorrecta"}'
          }
          for ruta in api backend-api; do
            if [ "$ruta" = api ]; then A=203.0.113.10; B=198.51.100.20; else A=203.0.113.30; B=198.51.100.40; fi
            for i in 1 2 3 4 5; do login "$ruta" "$A" >/dev/null; done
            [ "$(login "$ruta" "$A")" = "429" ] || falla "/$ruta: la IP $A deberia quedar bloqueada tras 5 intentos"
            [ "$(login "$ruta" "$B")" = "401" ] || falla "/$ruta: otra IP quedo bloqueada, el back no recibe la IP real"
          done
          echo "Modo tunel OK"

      - name: Logs de los contenedores
        if: always()
        run: docker compose logs --no-color > compose-logs.txt 2>&1 || true

      - name: Guardar logs del ensayo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ensayo-deploy
          path: compose-logs.txt

      - name: Apagar y borrar todo
        if: always()
        run: docker compose down -v
